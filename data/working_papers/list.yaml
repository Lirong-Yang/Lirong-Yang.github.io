works:
- title: "Product Differentiation, Price Revisions, and Collusion"
  coauthors: "Yohanes E. Riyanto and Nilanjan Roy"
  book: "Revise and Resubmit, Management Science"
  abstract: >
      We design an experiment to examine the effects of a revision mechanism in a Hotelling price duopoly market. 
      This mechanism allows players to adjust prices at revision opportunities arriving randomly, with prices set at the last opportunity being implemented. 
      We find that the revision mechanism leads to higher implemented prices and profits, with the marginal benefit of allowing price revisions in achieving collusion increasing in the degree of product differentiation. 
      Achieving more collusive prices in the presence of a stochastic revision mechanism without any overt communication highlights the challenges faced by regulators in the age of algorithmic pricing.

- title: "Equilibrium Selection through Action Revision: Experiments"
  coauthors: "Yohanes E. Riyanto and Nilanjan Roy"
  abstract: >
      We designed an experiment to examine the effects of allowing players to revise their actions in coordination games with conflicting interests. 
      Players receive random opportunities to revise actions, with final payoffs determined by actions at the last opportunity. 
      Our experiment encompasses a Battle-of-the-Sexes game and three variations of the inequality game. 
      Our treatments adjust the arrival frequency of revision opportunities, which affects the equilibrium selection predictions. 
      The results reveal higher coordination rates with action revision compared to the mixed-strategy Nash equilibrium. 
      The findings support theoretical predictions that players with fewer revision chances are more likely to realize their preferred outcomes. 
      Beyond the frequency of the revision, the payoff structure emerges as a crucial factor in determining equilibrium selection.
