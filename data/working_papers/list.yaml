works:
- title: "Product Differentiation, Price Revisions, and Collusion"
  coauthors: "Yohanes E. Riyanto and Nilanjan Roy"
  book: "Revise and Resubmit, Management Science"
  abstract: >
      We design an experiment to examine the effects of a revision mechanism in a Hotelling
price duopoly market. This mechanism allows players to adjust prices at revision opportunities
arriving randomly, with prices set at the last opportunity being implemented. We
find that the revision mechanism leads to higher implemented prices and profits, with the
marginal benefit of allowing price revisions in achieving collusion increasing in the degree
of product differentiation. Achieving more collusive prices in the presence of a stochastic
revision mechanism without any overt communication highlights the challenges faced by
regulators in the age of algorithmic pricing.

- title: "Equilibrium Selection through Action Revision: Experiments"
  coauthors: "Yohanes E. Riyanto and Nilanjan Roy"
  abstract: >
      We designed an experiment on action revision in coordination games with conflicting
interests. Players privately adjust their desired actions during a revision period, and these
revision opportunities make those choices public and binding. We reverse which player receives
revision opportunities more often in Battle of the Sexes and three inequality games,
and vary the column player’s miscoordination cost across the inequality
games. Players obtain their preferred equilibrium more often when they receive fewer
revision opportunities. The difference between treatments ranges from 16 to 21 percentage
points for the row player and from 10 to 19 for the column player. Intuitively, fewer
chances to revise make a player’s current action more persistent, encouraging the opponent
to accommodate it. The row player’s preferred equilibrium occurs more often when insisting
is more costly. Players may choose compatible actions but end with a mismatch if those 
choices never become binding. We compare two rules. Respond-Now (RN) favors actions that pay better
against the opponent’s current action; Look-Ahead (LA) anticipates future opportunities.
We fit each with and without stay-put (SP), a tendency to leave the public action unchanged.
Among the models compared, RN+SP best predicts outcomes in sessions not used to fit the
model. Reported LLM simulations show the same patterns. Revision opportunities shape
which equilibrium players reach, not only whether they coordinate.
